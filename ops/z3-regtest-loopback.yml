# Apply after the Z3 base and regtest Compose files. This changes host port
# bindings only; named chain and encrypted wallet volumes remain untouched.
services:
  zebra:
    ports: !override
      - "127.0.0.1:${Z3_ZEBRA_HOST_RPC_PORT:-29232}:${Z3_ZEBRA_RPC_PORT:-18232}"
      - "127.0.0.1:${Z3_ZEBRA_HOST_HEALTH_PORT:-28080}:8080"
  zallet:
    ports: !override
      - "127.0.0.1:${Z3_ZALLET_HOST_RPC_PORT:-50232}:28232"
  rpc-router:
    ports: !override
      - "127.0.0.1:${Z3_REGTEST_RPC_ROUTER_HOST_PORT:-8181}:8181"
  zaino:
    ports: !override
      - "127.0.0.1:${Z3_ZAINO_HOST_GRPC_PORT:-28137}:8137"
      - "127.0.0.1:${Z3_ZAINO_HOST_JSON_RPC_PORT:-28237}:8237"
  jaeger:
    ports: !override
      - "127.0.0.1:${Z3_JAEGER_UI_PORT:-36686}:16686"
      - "127.0.0.1:${Z3_JAEGER_OTLP_GRPC_PORT:-25317}:4317"
      - "127.0.0.1:${Z3_JAEGER_OTLP_HTTP_PORT:-25318}:4318"
      - "127.0.0.1:${Z3_JAEGER_SPANMETRICS_PORT:-28889}:8889"
  prometheus:
    ports: !override
      - "127.0.0.1:${Z3_PROMETHEUS_PORT:-29094}:9090"
  grafana:
    ports: !override
      - "127.0.0.1:${Z3_GRAFANA_PORT:-23000}:3000"
  alertmanager:
    ports: !override
      - "127.0.0.1:${Z3_ALERTMANAGER_PORT:-29093}:9093"
