# Apply with the Z3 base Compose file and its existing .env.testnet.
# Management endpoints stay on the WSL host; only testnet P2P is public.
services:
  zebra:
    ports: !override
      - "127.0.0.1:18232:18232"
      - "0.0.0.0:18233:18233"
      - "127.0.0.1:18080:8080"
  zallet:
    ports: !override
      - "127.0.0.1:40232:28232"
  zaino:
    ports: !override
      - "127.0.0.1:${Z3_ZAINO_HOST_GRPC_PORT:-18137}:8137"
      - "127.0.0.1:${Z3_ZAINO_HOST_JSON_RPC_PORT:-18237}:8237"
  jaeger:
    ports: !override
      - "127.0.0.1:${Z3_JAEGER_UI_PORT:-26686}:16686"
      - "127.0.0.1:${Z3_JAEGER_OTLP_GRPC_PORT:-15317}:4317"
      - "127.0.0.1:${Z3_JAEGER_OTLP_HTTP_PORT:-15318}:4318"
      - "127.0.0.1:${Z3_JAEGER_SPANMETRICS_PORT:-18889}:8889"
  prometheus:
    ports: !override
      - "127.0.0.1:${Z3_PROMETHEUS_PORT:-19094}:9090"
  grafana:
    ports: !override
      - "127.0.0.1:${Z3_GRAFANA_PORT:-13000}:3000"
  alertmanager:
    ports: !override
      - "127.0.0.1:${Z3_ALERTMANAGER_PORT:-19093}:9093"
